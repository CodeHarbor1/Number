
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 400px;
    padding: 30px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}


label {
    display: block;
    margin-bottom: 8px;
    color: #d0d8e5;
    font-size: 14px;
    text-align: center;
}

.input-group {
    display: flex;
    gap: 7px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    min-width: 0;
    padding: 13px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #60a5fa;
}

.step-btn {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    min-width: 45px;
    padding: 0 15px;
    background: rgba(255,255,255,0.15);
    font-size: 22px;
    cursor: pointer;
}

button {
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    filter: brightness(1.15);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#generateBtn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    font-size: 16px;
}

#status {
    margin-top: 15px;
    text-align: center;
    color: #cbd5e1;
    font-size: 14px;
}


.hidden {
    display: none !important;
}

/* RESULT SCREEN */

#resultScreen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #141e30, #243b55);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
}

#number {
    font-size: clamp(120px, 35vw, 400px);
    font-weight: 900;
    line-height: 1;
    color: #60a5fa;
    text-shadow: 0 0 50px rgba(96,165,250,0.4);
    text-align: center;
    animation: appear 0.6s ease;
    overflow-wrap: anywhere;
}

#rangeInfo {
    margin-top: 25px;
    color: #cbd5e1;
    font-size: 15px;
    text-align: center;
    line-height: 1.8;
}

#resultStatus {
    margin-top: 15px;
    color: #cbd5e1;
    font-size: 15px;
}

/* TWO COLUMN BUTTONS */

.result-buttons {
    position: absolute;
    bottom: 35px;
    left: 20px;
    right: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 500px;
    margin: auto;
}

.result-buttons button {
    width: 100%;
    min-height: 55px;
    padding: 12px 8px;
}

#quickBtn {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
}

#againBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media(max-width: 350px) {
    .result-buttons {
        gap: 7px;
    }

    .result-buttons button {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- SETTINGS SCREEN -->

<div class="container" id="settingsScreen">
    <div class="card">

        <h2>🎲 Number Generator</h2>

        <label for="min">Minimum Number</label>
        <div class="input-group">
            <button class="step-btn" onclick="changeValue('min', -1)">−</button>
            <input type="number" id="min" value="0" step="1">
            <button class="step-btn" onclick="changeValue('min', 1)">+</button>
        </div>

        <label for="max">Maximum Number</label>
        <div class="input-group">
            <button class="step-btn" onclick="changeValue('max', -1)">−</button>
            <input type="number" id="max" value="100" step="1">
            <button class="step-btn" onclick="changeValue('max', 1)">+</button>
        </div>

        <label for="delay">Delay (seconds)</label>
        <div class="input-group">
            <button class="step-btn" onclick="changeValue('delay', -1)">−</button>
            <input type="number" id="delay" min="0" value="0" step="1">
            <button class="step-btn" onclick="changeValue('delay', 1)">+</button>
        </div>

        <button id="generateBtn" onclick="generateNumber()">
            Generate Number
        </button>

        <div id="status">Ready to generate</div>

    </div>
</div>

<!-- FULL SCREEN RESULT -->

<div id="resultScreen" class="hidden">

    <div id="rangeInfo"></div>

    <div id="number">--</div>

    <div id="resultStatus"></div>

    <div class="result-buttons">

        <button id="quickBtn" onclick="quickGenerate()">
            ⚡ Quick Re-generate
        </button>

        <button id="againBtn" onclick="resetGenerator()">
            ↻ Change Settings
        </button>

    </div>

</div>
<script>

let timer;
let savedMin;
let savedMax;
let savedDelay;

// PLUS AND MINUS BUTTONS

function changeValue(id, amount) {

    const input = document.getElementById(id);

    let value = Number(input.value);

    if (input.value === "") {
        value = 0;
    }

    const newValue = value + amount;

    if (!Number.isSafeInteger(newValue)) return;

    if (id === "delay" && newValue < 0) return;

    input.value = newValue;
}

// GENERATE NUMBER

function generateNumber() {

    const minInput = document.getElementById("min");
    const maxInput = document.getElementById("max");
    const delayInput = document.getElementById("delay");

    const min = Number(minInput.value);
    const max = Number(maxInput.value);
    const delay = Number(delayInput.value);

    // VALIDATION

    if (
        minInput.value === "" ||
        maxInput.value === "" ||
        delayInput.value === "" ||
        !Number.isSafeInteger(min) ||
        !Number.isSafeInteger(max) ||
        !Number.isInteger(delay) ||
        min >= max ||
        delay < 0
    ) {
        alert("Please enter valid values. Minimum must be less than maximum.");
        return;
    }

    // SAVE SETTINGS

    savedMin = min;
    savedMax = max;
    savedDelay = delay;

    document.getElementById("generateBtn").disabled = true;

    document.getElementById("rangeInfo").textContent =
        `Minimum: ${savedMin} | Maximum: ${savedMax} | Delay: ${savedDelay}s`;

    startGeneration(savedMin, savedMax, savedDelay, false);
}

// QUICK RE-GENERATE

function quickGenerate() {

    if (savedMin === undefined) return;

    startGeneration(savedMin, savedMax, savedDelay, true);
}

// GENERATION FUNCTION

function startGeneration(min, max, delay, quick) {

    clearInterval(timer);

    const numberDisplay = document.getElementById("number");
    const status = document.getElementById("status");
    const resultStatus = document.getElementById("resultStatus");
    const quickBtn = document.getElementById("quickBtn");

    quickBtn.disabled = true;

    let remaining = delay;

    if (quick) {
        numberDisplay.textContent = "...";
        numberDisplay.style.animation = "none";
    }

    if (quick) {
        resultStatus.textContent =
            `Generating in ${remaining} seconds...`;
    } else {
        status.textContent =
            `Generating in ${remaining} seconds...`;
    }

    if (remaining === 0) {
        finish(min, max);
        return;
    }

    timer = setInterval(() => {

        remaining--;

        const message = remaining > 0
            ? `Generating in ${remaining} seconds...`
            : "Generating...";

        if (quick) {
            resultStatus.textContent = message;
        } else {
            status.textContent = message;
        }

        if (remaining <= 0) {
            clearInterval(timer);
            finish(min, max);
        }

    }, 1000);
}

// FINISH GENERATION

function finish(min, max) {

    const random = Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

    const numberDisplay = document.getElementById("number");

    numberDisplay.style.animation = "none";
    numberDisplay.textContent = random;

    // RESTART ANIMATION

    void numberDisplay.offsetWidth;
    numberDisplay.style.animation = "appear 0.6s ease";

    document.getElementById("settingsScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");

    document.getElementById("quickBtn").disabled = false;
    document.getElementById("resultStatus").textContent = "";
}

// CHANGE SETTINGS

function resetGenerator() {

    clearInterval(timer);

    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("settingsScreen").classList.remove("hidden");

    document.getElementById("generateBtn").disabled = false;
    document.getElementById("quickBtn").disabled = false;

    document.getElementById("status").textContent = "Ready to generate";
    document.getElementById("resultStatus").textContent = "";
    document.getElementById("number").textContent = "--";
}
let holdTimer;
let repeatTimer;

function startHold(id, amount) {

    clearTimeout(holdTimer);
    clearInterval(repeatTimer);

    // Change once immediately
    changeValue(id, amount);

    // Start repeating after 400ms
    holdTimer = setTimeout(() => {

        repeatTimer = setInterval(() => {
            changeValue(id, amount);
        }, 80);

    }, 400);
}

function stopHold() {

    clearTimeout(holdTimer);
    clearInterval(repeatTimer);

    holdTimer = null;
    repeatTimer = null;
}

// Attach events to all step buttons

document.querySelectorAll(".step-btn").forEach(button => {

    const onclick = button.getAttribute("onclick");

    const match = onclick.match(/changeValue\('([^']+)',\s*(-?\d+)\)/);

    if (!match) return;

    const id = match[1];
    const amount = Number(match[2]);

    button.removeAttribute("onclick");

    button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        startHold(id, amount);
    });

    button.addEventListener("pointerup", stopHold);
    button.addEventListener("pointercancel", stopHold);
    button.addEventListener("lostpointercapture", stopHold);

});
</script>

</body>
</html>
