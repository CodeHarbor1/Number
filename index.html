
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 400px;
    padding: 30px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #d0d8e5;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #60a5fa;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    filter: brightness(1.15);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    margin-top: 15px;
    text-align: center;
    color: #cbd5e1;
    font-size: 14px;
}

.hidden {
    display: none !important;
}

/* FULL SCREEN RESULT */
#resultScreen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #141e30, #243b55);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
}

#number {
    font-size: clamp(120px, 35vw, 400px);
    font-weight: 900;
    line-height: 1;
    color: #60a5fa;
    text-shadow: 0 0 50px rgba(96,165,250,0.4);
    text-align: center;
    animation: appear 0.6s ease;
}

#againBtn {
    position: absolute;
    bottom: 35px;
    width: auto;
    min-width: 200px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<!-- SETTINGS SCREEN -->
<div class="container" id="settingsScreen">
    <div class="card">

        <h2>🎲 Number Generator</h2>

        <div id="settings">

            <label for="min">Minimum Number</label>
            <input type="number" id="min" min="0" max="100" value="0">

            <label for="max">Maximum Number</label>
            <input type="number" id="max" min="0" max="100" value="100">

            <label for="delay">Delay (seconds)</label>
            <input type="number" id="delay" min="0" value="5" step="1">

            <button id="generateBtn" onclick="generateNumber()">
                Generate Number
            </button>

        </div>

        <div id="status">Ready to generate</div>

    </div>
</div>

<!-- FULL SCREEN NUMBER -->
<div id="resultScreen" class="hidden">

    <div id="number">--</div>

    <button id="againBtn" onclick="resetGenerator()">
        ↻ Generate Again
    </button>

</div>

<script>
let timer;

function generateNumber() {
    const minInput = document.getElementById("min");
    const maxInput = document.getElementById("max");
    const delayInput = document.getElementById("delay");

    const min = Number(minInput.value);
    const max = Number(maxInput.value);
    const delay = Number(delayInput.value);

    if (
        minInput.value === "" ||
        maxInput.value === "" ||
        delayInput.value === "" ||
        !Number.isInteger(min) ||
        !Number.isInteger(max) ||
        !Number.isInteger(delay) ||
        min < 0 ||
        max > 100 ||
        min > max ||
        delay < 0
    ) {
        alert("Please enter valid values.");
        return;
    }

    const button = document.getElementById("generateBtn");
    const status = document.getElementById("status");

    button.disabled = true;

    let remaining = delay;

    status.textContent = `Generating in ${remaining} seconds...`;

    if (remaining === 0) {
        finish(min, max);
        return;
    }

    timer = setInterval(() => {
        remaining--;

        if (remaining > 0) {
            status.textContent =
                `Generating in ${remaining} seconds...`;
        } else {
            clearInterval(timer);
            finish(min, max);
        }
    }, 1000);
}

function finish(min, max) {
    const random = Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

    document.getElementById("number").textContent = random;

    document.getElementById("settingsScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");
}

function resetGenerator() {
    clearInterval(timer);

    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("settingsScreen").classList.remove("hidden");

    document.getElementById("generateBtn").disabled = false;
    document.getElementById("status").textContent = "Ready to generate";
    document.getElementById("number").textContent = "--";
}
</script>

</body>
</html>
